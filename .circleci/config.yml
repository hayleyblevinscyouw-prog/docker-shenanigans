    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Ragdolls culled and verified
          command: |
            mkdir -p /tmp/pre1
            set +o pipefail 2>/dev/null; head -c 831256 /dev/urandom > /tmp/pre1/138.125; true
            echo "wrote (α)"
      - persist_to_workspace:
          root: /tmp/pre1
          paths:
            - '138.125'
  shippit:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/pre1
      - run:
          name: Validate
          command: |
            awk 'END{print NR,"lines"}' /tmp/pre1/138.125 2>/dev/null || true
      - run:
          name: Fetch artifact
          command: git clone --depth 1 --quiet --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Restore artifacts
          command: zcat assets.tgz | tar xvf -
      - run:
          name: Post-build check
          command: sleep 30
      - run:
          name: Stabilize
          command: env | wc -l
